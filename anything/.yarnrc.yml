# These peer dep warnings are from upstream packages with stale ranges that
# work fine with our versions. @lshay/ui declares react 18 / tailwindcss 3
# but works with 19 / 4; expo-three uses old expo SDK ranges;
# @expo/cli still requests the deprecated @types/react-native.
logFilters:
  - code: YN0060
    level: discard
  - code: YN0002
    level: discard
  - code: YN0068
    level: discard
  - code: YN0086
    level: discard

nmMode: hardlinks-global

nodeLinker: node-modules

# Pins the exact Yarn binary for every environment. Vercel's build image ships
# Yarn 1.22.x, which cannot parse this workspace (Berry `patch:` resolutions,
# v4 lockfile) — but Yarn 1.22 honors `yarnPath` and hands off to the release
# below, so the build no longer depends on Corepack being enabled.
yarnPath: .yarn/releases/yarn-4.12.0.cjs

# sharp ships one native binary per platform, and its libvips .so lives in a
# sibling @img/sharp-libvips-<platform> package. Yarn installs only the
# CURRENT architecture by default, so a lockfile resolved on macOS leaves the
# Linux binaries absent — and Vercel's traced bundle then has nothing to ship.
# Naming linux/x64/glibc explicitly keeps the deploy target's binaries present
# in every install, whatever machine ran it.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
