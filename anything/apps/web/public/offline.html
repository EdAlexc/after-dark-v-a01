<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#121212" />
		<title>Offline — AfterDark</title>
		<!--
			Served by the service worker as the navigation fallback (P10.2).
			Deliberately script-free and self-contained: it is precached, so it must
			never carry a session nonce, personal data, or anything that goes stale.
		-->
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #121212;
				color: rgba(255, 255, 255, 0.87);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				padding: 24px;
				text-align: center;
			}
			main {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
				max-width: 420px;
			}
			.logo {
				font-size: 28px;
				font-weight: 900;
				letter-spacing: -0.05em;
				color: #00ffcc;
			}
			h1 {
				font-size: 22px;
				font-weight: 700;
			}
			p {
				color: rgba(255, 255, 255, 0.5);
				font-size: 15px;
				line-height: 1.6;
			}
			a {
				display: inline-block;
				margin-top: 8px;
				padding: 12px 28px;
				border-radius: 12px;
				background: #00ffcc;
				color: #121212;
				font-weight: 700;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<span class="logo">AFTERDARK</span>
			<h1>You&rsquo;re offline</h1>
			<p>
				AfterDark needs a connection for live gigs, messages, and check-ins.
				Reconnect and try again — nothing you did was lost.
			</p>
			<a href="/">Retry</a>
		</main>
	</body>
</html>
