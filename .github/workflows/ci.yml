# AfterDark CI (DEV_TIMELINE P0.4 / TENANT_GUARDRAIL §7 gates)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web — typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anything
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck (strict — no ignoreBuildErrors)
        run: yarn workspace web run typecheck

      - name: Lint (oxlint — Backlog #20)
        run: yarn workspace web run lint

      - name: Unit & route tests (vitest)
        run: yarn workspace web run test

      - name: Production build
        run: yarn workspace web run build

  alpha-gates:
    # P10.4 — the alpha exit gate (TENANT_GUARDRAIL §3.2/§3.4; DEV_TIMELINE §5).
    # Self-contained: a vanilla Postgres + the local Neon-protocol proxy stand
    # in for Neon (NEON_LOCAL_PROXY=1 — see api/utils/neon-local.ts), so no
    # database secrets exist in CI. The app is migrated, seeded, built, and
    # served, then gated: verify-rls as a non-owner role (Gate 0, S12), the
    # backfill-media zero-inline-rows check (S15), a ZAP baseline (S15,
    # 0 High/Medium), axe smoke (10 screens, fail on critical), Lighthouse
    # budgets (§3.2 levels in lighthouserc.cjs), and k6 Apdex ≥ 0.85 at the
    # CI-calibrated APDEX_T=1600 ms — a relative regression tripwire on this
    # co-hosted 2-core runner, NOT the §3 T=300 ms bar, which stays the
    # pre-release load lab's job (TESTING.md §11).
    name: Alpha gates — axe, Lighthouse, k6 (P10.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anything
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afterdark
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neon-proxy:
        # Community image implementing Neon's SQL-over-HTTP (:4444/sql) and
        # WebSocket (:4444/v2) endpoints in front of vanilla Postgres — the
        # standard keyless local recipe from Neon's own local-dev guide.
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/afterdark
        ports:
          - 4444:4444
    env:
      # db.localtest.me resolves to 127.0.0.1 → the proxy service port.
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/afterdark
      NEON_LOCAL_PROXY: '1'
      BETTER_AUTH_URL: http://localhost:4000
      BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Ephemeral run secrets
        # Generated per run, never stored: the auth secret signs this run's
        # sessions only; the preview secret derives this run's account
        # passwords (same S1 scheme as every environment).
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "PREVIEW_ACCOUNTS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Migrate, seed, provision preview accounts
        run: |
          yarn workspace web run db:migrate
          yarn workspace web run db:seed
          yarn workspace web run db:preview-accounts > /dev/null

      - name: Zero-inline-media gate (S15, db:backfill-media --verify)
        # scripts/backfill-media.ts exits non-zero while ANY `data:` image row
        # exists — proving on every PR that no seed/fixture/code path
        # reintroduces the inline-media storage S3 closed (the same command is
        # the operator's post-B5 production check).
        run: yarn workspace web run db:backfill-media --verify

      - name: Gate 0 — RLS enforcement proof (S12, db:verify-rls as the non-owner role)
        # Proves the committed policies actually enforce, on every PR: a
        # throwaway least-privilege role is provisioned on the job's Postgres
        # (ci-rls-role.mjs), granted via scripts/grants.sql, and the 23-check
        # verify suite runs as that role over the WebSocket tunnel — the
        # credential-faithful path; verify-rls's check 0 fails loudly if role
        # identity ever doesn't survive the proxy.
        run: |
          RLS_ROLE_PASSWORD="$(openssl rand -hex 24)"
          RLS_ROLE_PASSWORD="$RLS_ROLE_PASSWORD" node apps/web/scripts/ci-rls-role.mjs
          yarn workspace web run db:grants
          OWNER_URL="$DATABASE_URL" \
          RLS_URL="postgres://afterdark_app:${RLS_ROLE_PASSWORD}@db.localtest.me:5432/afterdark" \
          yarn workspace web run db:verify-rls

      - name: Build & start (production server)
        run: |
          yarn workspace web run build
          nohup yarn workspace web run start -p 4000 > /tmp/next-start.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4000 --timeout 60000

      - name: Gate 1 — axe smoke (10 screens, fail on critical)
        run: |
          yarn workspace web exec playwright install --with-deps chromium
          yarn workspace web run gate:axe

      - name: Gate 2 — Lighthouse budgets (§3.2)
        run: yarn workspace web run gate:lhci

      - name: Gate 3 — k6 Apdex (§3.4 shapes, smoke scale)
        uses: grafana/setup-k6-action@v1

      - name: Run k6
        working-directory: anything/apps/web
        # APDEX_T=1600 is the CI calibration, measured, not guessed: on the
        # 2-core runner co-hosting server+Postgres+proxy+load generator the
        # observed clean-run distribution is med≈0.9s / p90≈1.9s (min 100 ms
        # — the floor is fine, the rest is queueing). CI's number is a
        # RELATIVE regression tripwire: the ≥0.85 Apdex formula is identical,
        # so a latency regression still fails here, while the §3 T=300 ms
        # bar belongs to the pre-release load lab (TESTING.md §11).
        run: k6 run k6/alpha-gates.js -e BASE_URL="$BASE_URL" -e PREVIEW_ACCOUNTS_SECRET="$PREVIEW_ACCOUNTS_SECRET" -e APDEX_T=1600

      - name: Gate 4 — ZAP baseline (S15, 0 High/Medium)
        # OWASP ZAP passive baseline against the same running server —
        # TENANT_GUARDRAIL §7's "ZAP baseline: 0 High/Medium" box, enforced
        # by scripts/zap-gate.mjs over the JSON report (per-finding accepted
        # risks live IN that script, on the record; zap-baseline's own -I
        # keeps its warn-exit out of the way so our gate is the only gate).
        # Runs after k6 so spider traffic never pollutes the perf numbers.
        run: |
          mkdir -p zap-work && chmod 777 zap-work
          docker run --rm --network host -v "$PWD/zap-work:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "$BASE_URL" -J zap.json -I -T 5
          node apps/web/scripts/zap-gate.mjs zap-work/zap.json

      - name: Keep ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: anything/zap-work/zap.json
          if-no-files-found: ignore

      - name: Server log (on failure)
        if: failure()
        run: tail -80 /tmp/next-start.log || true

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: anything/apps/web/.lighthouseci/reports
          if-no-files-found: ignore

  security:
    name: Security — dependency audit & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        working-directory: anything
        run: yarn install --immutable

      - name: Dependency audit (fail on high+)
        working-directory: anything
        run: yarn npm audit --severity high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
